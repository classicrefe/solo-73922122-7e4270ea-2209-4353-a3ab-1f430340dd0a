<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示波器波形采集</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; background: #f4f6f8; color: #222; }
  header { background: #1f3a5f; color: #fff; padding: 14px 24px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .8; margin-top: 4px; }
  main { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 8px; padding: 16px 20px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  select, button { font-size: 14px; padding: 8px 14px; border-radius: 6px;
                   border: 1px solid #c8d0d8; background: #fff; cursor: pointer; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.primary:disabled { background: #9db8e0; border-color: #9db8e0; cursor: default; }
  button.danger { background: #d64545; border-color: #d64545; color: #fff; }
  button.link { border: none; background: none; color: #1f6feb; padding: 2px 6px; }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #e6eaee;
           white-space: nowrap; }
  th { color: #667; font-weight: 600; background: #fafbfc; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px;
           font-size: 12px; font-weight: 600; }
  .st-queued     { background: #e8eaed; color: #555; }
  .st-running    { background: #dbeafe; color: #1d4ed8; }
  .st-cancelling { background: #ffedd5; color: #c2410c; }
  .st-done       { background: #dcfce7; color: #15803d; }
  .st-cancelled  { background: #e8eaed; color: #777; }
  .st-error      { background: #fee2e2; color: #b91c1c; }
  .err { color: #b91c1c; font-size: 12px; max-width: 220px; overflow: hidden;
         text-overflow: ellipsis; }
  #toast { position: fixed; top: 14px; right: 14px; background: #333; color: #fff;
           padding: 10px 16px; border-radius: 6px; font-size: 13px; display: none; }
  .mono { font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>示波器波形采集</h1>
  <div class="sub" id="scopeInfo">SCPI/TCP 仪器：连接信息加载中…</div>
</header>
<main>
  <div class="card">
    <div class="controls">
      <label>通道：
        <select id="channel">
          <option value="1">CHANnel1</option>
          <option value="2">CHANnel2</option>
        </select>
      </label>
      <button class="primary" id="acquireBtn" onclick="acquire()">开始采集</button>
      <span style="color:#889;font-size:12px">
        每次冻结捕获 4096 点（16 位有符号、小端），完成后可下载电压-时间 CSV。
      </span>
    </div>
  </div>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>通道</th><th>状态</th><th>采样间隔 (s)</th>
          <th>电压比例 (V/LSB)</th><th>偏移 (V)</th><th>点数</th>
          <th>错误</th><th>创建时间</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="10">加载中…</td></tr></tbody>
    </table>
  </div>
</main>
<div id="toast"></div>
<script src="/static/refresh.js"></script>
<script>
const STATUS_TEXT = {
  queued: '排队中', running: '采集中', cancelling: '取消中',
  done: '完成', cancelled: '已取消', error: '错误'
};
// Window size. The default is the required "newest 50"; ?limit=N (1..200) is
// a demo/testing affordance so a row leaving the window can be shown quickly.
const PAGE_SIZE = (() => {
  const raw = new URLSearchParams(location.search).get('limit');
  const n = parseInt(raw, 10);
  return Number.isFinite(n) ? Math.min(200, Math.max(1, n))
                            : AcqRefresh.DEFAULT_PAGE_SIZE;
})();
// Holds the newest window (bounded), the server cursor and process epoch.
const state = AcqRefresh.createState(PAGE_SIZE);
// Only one poll in flight; extra triggers collapse into one follow-up poll.
let inFlight = false;
let refreshQueued = false;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let detail = r.status;
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return r.json();
}
async function acquire() {
  const channel = parseInt(document.getElementById('channel').value, 10);
  try {
    const job = await api('/api/acquisitions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({channel})
    });
    toast('已提交采集 #' + job.id);
    requestRefresh();
  } catch (e) { toast('提交失败: ' + e.message); }
}
async function cancel(id) {
  try {
    const job = await api('/api/acquisitions/' + id + '/cancel', {method: 'POST'});
    toast('采集 #' + id + '：' + (STATUS_TEXT[job.status] || job.status));
    requestRefresh();
  } catch (e) { toast('取消失败: ' + e.message); }
}
function fmt(v, digits) {
  if (v === null || v === undefined) return '—';
  return Number(v).toExponential(digits === undefined ? 3 : digits);
}
function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString('zh-CN', {hour12: false}) +
         '.' + String(d.getMilliseconds()).padStart(3, '0');
}
function esc(v) {
  return String(v).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}
// Stable fingerprint of the fields that affect a rendered row (including the
// fields behind the cancel / download buttons).
function rowKey(j) {
  return [j.status, j.error, j.sample_interval, j.volt_scale, j.volt_offset,
          j.points, j.has_samples, j.created_at, j.channel].join('\u0001');
}
function rowHtml(j) {
  const st = j.status;
  const canCancel = (st === 'queued' || st === 'running' || st === 'cancelling');
  const canDownload = (st === 'done' && j.has_samples);
  const ops = [];
  if (canCancel)
    ops.push(`<button class="link" onclick="cancel(${j.id})">取消</button>`);
  if (canDownload)
    ops.push(`<button class="link" onclick="location.href='/api/acquisitions/${j.id}/csv'">下载CSV</button>`);
  return `<td class="mono">${j.id}</td>
      <td>CHANnel${j.channel}</td>
      <td><span class="badge st-${esc(st)}">${esc(STATUS_TEXT[st] || st)}</span></td>
      <td class="mono">${fmt(j.sample_interval)}</td>
      <td class="mono">${fmt(j.volt_scale)}</td>
      <td class="mono">${fmt(j.volt_offset)}</td>
      <td class="mono">${j.points ?? '—'}</td>
      <td class="err" title="${j.error ? esc(j.error) : ''}">${j.error ? esc(j.error) : ''}</td>
      <td class="mono">${fmtTime(j.created_at)}</td>
      <td>${ops.join(' ')}</td>`;
}
function ensureRow(j) {
  let tr = document.getElementById('row-' + j.id);
  if (!tr) {
    tr = document.createElement('tr');
    tr.id = 'row-' + j.id;
    tr.dataset.key = '';
  }
  const key = rowKey(j);
  if (tr.dataset.key !== key) {
    tr.innerHTML = rowHtml(j);
    tr.dataset.key = key;
  }
  return tr;
}
const tbody = () => document.getElementById('rows');
function removeEmpty() {
  const empty = document.getElementById('emptyRow');
  if (empty) empty.remove();
}
function renderWindow() {
  const body = tbody();
  if (!state.order.length) {
    if (!document.getElementById('emptyRow')) {
      body.innerHTML = '<tr id="emptyRow"><td colspan="10">暂无采集记录</td></tr>';
    }
    for (const tr of Array.from(body.children)) {
      if (tr.id !== 'emptyRow') tr.remove();
    }
    return;
  }
  removeEmpty();
  // Reorder by appending in newest-first order. Existing nodes are moved, so
  // untouched rows keep their rendered content (no re-render, no flicker).
  for (const id of state.order) {
    const job = state.jobs.get(id);
    if (!job) continue;
    body.appendChild(ensureRow(job));
  }
  const keep = new Set(state.order.map(id => 'row-' + id));
  for (const tr of Array.from(body.children)) {
    if (tr.id !== 'emptyRow' && !keep.has(tr.id)) tr.remove();
  }
}
function renderResult(result) {
  if (!result.applied) return;  // stale / foreign response: keep current view
  if (result.full) {
    tbody().innerHTML = '';
    renderWindow();
    return;
  }
  if (!result.changed.length && !result.removed.length) return;  // no changes
  for (const id of result.changed) ensureRow(state.jobs.get(id));
  for (const id of result.removed) {
    const tr = document.getElementById('row-' + id);
    if (tr) tr.remove();
  }
  renderWindow();
}
async function poll() {
  if (inFlight) { refreshQueued = true; return; }
  inFlight = true;
  refreshQueued = false;
  try {
    // Always ask for a page sized to this view. When the cursor is unknown
    // or the server answers with a full page (?limit=N demo / restart), the
    // window stays consistent with what the page displays.
    const params = new URLSearchParams({limit: String(PAGE_SIZE)});
    if (state.cursor !== null && state.epoch !== null) {
      params.set('since', String(state.cursor));
      params.set('epoch', state.epoch);
    }
    const data = await api('/api/acquisitions/changes?' + params.toString());
    renderResult(AcqRefresh.apply(state, data));
  } catch (e) {
    /* transient failure: keep the cursor and retry next tick */
  } finally {
    inFlight = false;
    if (refreshQueued) {
      refreshQueued = false;
      poll();
    }
  }
}
// Trigger an immediate poll after a user action (submit/cancel).
function requestRefresh() {
  if (inFlight) { refreshQueued = true; return; }
  poll();
}
async function loadHealth() {
  try {
    const h = await api('/api/health');
    document.getElementById('scopeInfo').textContent =
      `SCPI/TCP 仪器：${h.scope}　单轮超时：${h.round_timeout_s}s`;
  } catch (e) {}
}
loadHealth();
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
